name: Sync Tailscale policy

# GitOps for policy/tailnet-policy.hujson.
#
# On a pull request the action only *tests* the policy (including the `tests`
# block, which Tailscale refuses to save when failing). On a push to the
# default branch it applies it. That ordering is the whole point: policy
# changes go through review, and a policy that would lock the gateway out of
# the engine fails the PR rather than production.
#
# Requires two repo secrets:
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET  — OAuth client with the
#   `policy_file` write scope. In the current console that lives under
#   Settings -> Trust credentials, not "OAuth clients".
#
#   TS_TAILNET — the tailnet name, as the admin console shows it (looks like
#   `example.com`, `yourorg.github`). The action declares this input as required
#   and does NOT accept the API's usual `-` shorthand for "default tailnet".
#
# Left empty the action still runs and the API answers 404
# `tailnet "acl" not found` -- the URL collapses to /tailnet//acl, so the error
# names a path segment rather than the missing parameter and reads like a broken
# policy file. The preflight step below turns that into a clear message.

on:
  push:
    branches: [main]
    paths: ['policy/tailnet-policy.hujson', '.github/workflows/tailscale-policy.yml']
  pull_request:
    branches: [main]
    paths: ['policy/tailnet-policy.hujson', '.github/workflows/tailscale-policy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preflight — required secrets are set
        env:
          TAILNET: ${{ secrets.TS_TAILNET }}
          CID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CSECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
        run: |
          missing=
          [ -n "$TAILNET" ] || missing="$missing TS_TAILNET"
          [ -n "$CID" ]     || missing="$missing TS_OAUTH_CLIENT_ID"
          [ -n "$CSECRET" ] || missing="$missing TS_OAUTH_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::missing repo secrets:$missing — see docs/tailnet-admin.md#policy-as-code"
            exit 1
          fi

      - name: Test policy (dry run)
        uses: tailscale/gitops-acl-action@v1
        with:
          action: test
          policy-file: ./policy/tailnet-policy.hujson
          tailnet: ${{ secrets.TS_TAILNET }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

      - name: Apply policy
        if: github.event_name != 'pull_request'
        uses: tailscale/gitops-acl-action@v1
        with:
          action: apply
          policy-file: ./policy/tailnet-policy.hujson
          tailnet: ${{ secrets.TS_TAILNET }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
